# Terminal & Shell
set -g default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"           # Native truecolor
set -g default-shell /usr/bin/fish           # Default shell
set -sg escape-time 10                       # Prevent glitches
set -g focus-events on
set -g mouse on
set -g set-clipboard on                      # Native OSC-52

# Window & Session Management
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                 # Keep session alive
set -g display-time 2000
set -g history-limit 50000
setw -g aggressive-resize on
set -g status-position bottom

# Prefix & Core Bindings
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind x kill-pane
bind c new-window -c "#{pane_current_path}"

# Panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind > swap-pane -D
bind < swap-pane -U

# Popups
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "btm"

# Copy Mode
set -g status-keys vi
set -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane     # Disable drag copy

# Status Bar
set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#00141A,fg=#657B83"
set -g status-left "#[fg=#00141A,bg=#49AEF5,bold] #S #[fg=#586E75,bg=#00141A] "
set -g status-left-length 40

set -g status-right "#[fg=#2AA198]%d %b #[fg=#49AEF5,bold]%H:%M"
set -g status-right-length 50

set -g window-status-format "#[fg=#586E75,bg=#00141A] #I:#W "
set -g window-status-current-format "#[fg=#B58900,bg=#00141A,bold] #I:#W "

setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#B58900,bg=#073642,bold"
set -g window-status-bell-style "fg=#00141A,bg=#DC322F,bold"

# Messages & Prompts
set -g message-style "bg=#00141A,fg=#49AEF5"
set -g message-command-style "bg=#00141A,fg=#2AA198"

# Pane Borders
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#2AA198,bold"
set -g pane-border-lines single
set -g pane-border-indicators both           # Show indicators

# Copy-Mode Styles
set -g mode-style "bg=#073642,fg=#B58900,bold"
set -g copy-mode-match-style "bg=#073642,fg=#49AEF5"
set -g copy-mode-current-match-style "bg=#073642,fg=#B58900,bold"
set -g copy-mode-mark-style "bg=#073642,fg=#D33682"

# Popups & Menus
set -g popup-border-style "fg=#073642"
set -g popup-border-lines rounded
set -g menu-style "bg=#00141A,fg=#657B83"
set -g menu-selected-style "bg=#073642,fg=#B58900,bold"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'      # Nav integration
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Persistence
set -g @plugin 'tmux-plugins/tmux-continuum'         # Autosave

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'            # Neovim sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'                 # Save interval

# Init TPM
run '~/.config/tmux/plugins/tpm/tpm'
